  memberListEl.innerHTML=a?(members||[]).map(function(m){return '<div class="row"><div class="row-main"><div class="row-name">'+esc(names[m.player_id]||m.player_id)+'</div></div><div class="row-meta">'+(String(m.player_id)===String(a.owner_player_id)?'盟主':'成员')+'</div></div>';}).join(""):"";
  if(a){document.getElementById("leave-alliance").onclick=function(){if(isOwner){modal("解散联盟","确定要解散「"+(a.name||a.code)+"」吗？全体成员将同时退出，该操作不可恢复。若只想自己离开，请回游戏内把盟主转让给其他成员。",function(){status.textContent="正在解散联盟…";api("/v1/rdb/rest/rpc/disband_alliance",{method:"POST",body:JSON.stringify({p_alliance_id:Number(a.id),p_owner_player_id:playerId})}).then(refresh).catch(showError);});return;}modal("退出联盟","确认要退出该联盟吗？",function(){api("/v1/rdb/rest/rpc/leave_alliance_member",{method:"POST",body:JSON.stringify({p_alliance_id:Number(a.id),p_player_id:playerId})}).then(refresh).catch(showError);});};}
  listEl.innerHTML=list.length?list.map(function(x){var cap=memberCapOf(x._buildings);var full=Number(x.member_count)>=cap;return '<div class="row"><div class="row-main"><div class="row-name">'+esc(x.name||x.code)+'</div><div class="row-meta">成员 '+esc(x.member_count)+'/'+cap+'</div></div>'+(a?'':full?'<span class="error">已满</span>':'<button class="join" data-id="'+esc(x.id)+'">加入</button>')+'</div>';}).join(""):'<div class="empty">暂无公开联盟</div>';
  Array.prototype.forEach.call(document.querySelectorAll(".join"),function(b){b.onclick=function(){api("/v1/rdb/rest/alliance_members",{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify({alliance_id:Number(b.dataset.id),player_id:playerId})}).then(refresh).catch(showError);};});
}
function decorateAllianceList(list){
  var names={frontier_hq:"总部",logistics_hub:"总部",mission_hall:"任务大厅",combat_command:"作战指挥部",refining_core:"冶炼中枢"};
  Array.prototype.forEach.call(listEl.querySelectorAll(".row"),function(row,index){
    var a=list[index],buildings=a&&Array.isArray(a._buildings)?a._buildings:[];
    var text=buildings.map(function(b){return (names[b.building_type]||b.building_type||"建筑")+" Lv."+(Number(b.level)||0)}).join(" · ")||"建筑数据暂无";
    var meta=document.createElement("div");meta.className="row-meta";meta.textContent="建筑："+text;
    var main=row.querySelector(".row-main");if(main)main.appendChild(meta);
  });
}
function refresh(){
  status.textContent="正在读取联盟信息…";
  return Promise.all([getCurrent(),getList()]).then(function(v){return Promise.all([Promise.resolve(v),v[0]?getMembers(v[0].id):Promise.resolve([])]);}).then(function(v){
    var a=v[0][0],list=v[0][1],members=v[1],ids=list.map(function(x){return x.owner_player_id;}).concat(members.map(function(x){return x.player_id;}));
    if(a)ids.push(a.owner_player_id);
    return getNames(ids).then(function(n){renderCurrent(a,list,n,members);decorateAllianceList(list);return loadBuildings(a);}).then(function(){status.textContent="已连接 CloudBase";});
  }).catch(showError);
}
document.getElementById("back").onclick=function(){
  if(!returnUrl){history.back();return;}
  Promise.all([Promise.resolve(latestAlliance?loadBuildings(latestAlliance):null).catch(function(){return null;}),loadTasks()]).then(function(){returnToGame({});});
};
function returnToGame(extra){
  if(!returnUrl){history.back();return;}
  var a=latestAlliance,params={
    allianceId:a&&a.id||"",allianceCode:a&&a.code||"",allianceOwner:a&&a.owner_player_id||"",
    allianceMembers:a&&a.member_count||"",allianceBuildingLevel:latestBuildingLevel,
    allianceSnapshot:JSON.stringify({id:a&&a.id||"",code:a&&a.code||"",memberCount:a&&a.member_count||0,construction:latestConstruction||{},buildings:latestBuildings||[],members:latestMembers||[],tasks:latestTasks||[]})
  };
  Object.keys(extra||{}).forEach(function(k){params[k]=extra[k];});
  var query=Object.keys(params).map(function(k){return encodeURIComponent(k)+"="+encodeURIComponent(params[k]);}).join("&");
  location.href=returnUrl+(returnUrl.indexOf("?")>=0?"&":"?")+query;
}
function handleRelay(){
  var action=qs.get("relayAction");
  if(!action)return Promise.resolve();
  if(!latestAlliance)throw Error("当前玩家尚未加入联盟");
  if(action==="upgrade_building"){
    status.textContent="正在升级联盟建筑…";
    var buildingType=qs.get("buildingType")||"";
    if(buildingType==="frontier_hq")buildingType="logistics_hub";
    return fn(functionBase+"/alliance-daily-tasks",{action:"upgrade_building",playerId:playerId,allianceId:Number(qs.get("allianceId")||latestAlliance.id),buildingType:buildingType})
      .then(function(){return loadBuildings(latestAlliance);}).then(function(){returnToGame({allianceRelayResult:"upgrade_success"});});
  }
  if(action==="submit_task"){
    var taskId=Number(qs.get("taskId")),amount=Number(qs.get("taskAmount"));
    if(!Number.isSafeInteger(taskId)||taskId<=0||!Number.isFinite(amount)||amount<=0)throw Error("任务提交参数无效");
    status.textContent="正在提交联盟任务…";
    return fn(functionBase+"/alliance-daily-tasks",{action:"submit",playerId:playerId,allianceId:Number(qs.get("allianceId")||latestAlliance.id),taskId:taskId,amount:amount})
      .then(function(){return Promise.all([loadBuildings(latestAlliance),loadTasks()]);})
      .then(function(){returnToGame({allianceTaskId:taskId,allianceTaskAmount:amount,allianceTaskCategory:qs.get("taskCategory")||"",allianceTaskMaterial:qs.get("taskMaterial")||"",allianceTaskSubmitted:"1"});});
  }
  throw Error("未知的联盟操作");
}
Promise.all([refresh(),loadTasks()]).then(handleRelay).catch(function(e){
  showError(e);
  if(!qs.get("relayAction"))return;
  var relayMsg=friendlyCloudError(e&&e.message)||"未知错误";
  status.textContent="联盟操作失败："+relayMsg+"（2 秒后自动返回游戏）";
  setTimeout(function(){returnToGame({allianceRelayError:relayMsg});},2000);
});
})();</script></body></html>
