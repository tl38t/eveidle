    ? '<div class="label">当前联盟</div><div class="alliance-code">'+esc(a.code)+'</div><div class="meta">盟主：'+esc(owner)+'<br>当前玩家 ID：'+esc(playerId)+'<br>联盟 ID：'+esc(a.id)+'</div><div class="actions"><button id="leave-alliance">'+(isOwner?'解散联盟':'退出联盟')+'</button></div>'
    : '<div class="empty">你还没有加入联盟。<br><span class="meta">当前玩家 ID：'+esc(playerId)+'</span></div>';
  memberPanel.hidden=!a;
  memberListEl.innerHTML=a?(members||[]).map(function(m){return '<div class="row"><div class="row-main"><div class="row-name">'+esc(names[m.player_id]||m.player_id)+'</div></div><div class="row-meta">'+(String(m.player_id)===String(a.owner_player_id)?'盟主':'成员')+'</div></div>';}).join(""):"";
  if(a){document.getElementById("leave-alliance").onclick=function(){if(isOwner){showError(Error("盟主不能直接退出，请先转让盟主"));return;}modal("退出联盟","确认要退出该联盟吗？",function(){api("/v1/rdb/rest/rpc/leave_alliance_member",{method:"POST",body:JSON.stringify({p_alliance_id:Number(a.id),p_player_id:playerId})}).then(refresh).catch(showError);});};}
  listEl.innerHTML=list.length?list.map(function(x){var full=Number(x.member_count)>=10;return '<div class="row"><div class="row-main"><div class="row-name">'+esc(x.name||x.code)+'</div><div class="row-meta">成员 '+esc(x.member_count)+'</div></div>'+(a?'':full?'<span class="error">已满</span>':'<button class="join" data-id="'+esc(x.id)+'">加入</button>')+'</div>';}).join(""):'<div class="empty">暂无公开联盟</div>';
  Array.prototype.forEach.call(document.querySelectorAll(".join"),function(b){b.onclick=function(){api("/v1/rdb/rest/alliance_members",{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify({alliance_id:Number(b.dataset.id),player_id:playerId})}).then(refresh).catch(showError);};});
}
function decorateAllianceList(list){
  var names={frontier_hq:"总部",logistics_hub:"总部",mission_hall:"任务大厅",combat_command:"作战指挥部",refining_core:"冶炼中枢"};
  Array.prototype.forEach.call(listEl.querySelectorAll(".row"),function(row,index){
    var a=list[index],buildings=a&&Array.isArray(a._buildings)?a._buildings:[];
    var text=buildings.map(function(b){return (names[b.building_type]||b.building_type||"建筑")+" Lv."+(Number(b.level)||0)}).join(" · ")||"建筑数据暂无";
    var meta=document.createElement("div");meta.className="row-meta";meta.textContent="建筑："+text;
    var main=row.querySelector(".row-main");if(main)main.appendChild(meta);
  });
}
function refresh(){
  status.textContent="正在读取联盟信息…";
  Promise.all([getCurrent(),getList()]).then(function(v){return Promise.all([Promise.resolve(v),v[0]?getMembers(v[0].id):Promise.resolve([])]);}).then(function(v){
    var a=v[0][0],list=v[0][1],members=v[1],ids=list.map(function(x){return x.owner_player_id;}).concat(members.map(function(x){return x.player_id;}));
    if(a)ids.push(a.owner_player_id);
    return getNames(ids).then(function(n){renderCurrent(a,list,n,members);decorateAllianceList(list);return loadBuildings(a);}).then(function(){status.textContent="已连接 CloudBase";});
  }).catch(showError);
}
document.getElementById("back").onclick=function(){
  if(!returnUrl){history.back();return;}
  Promise.resolve(latestAlliance?loadBuildings(latestAlliance):null).catch(function(){return null;}).then(function(){
    var sep=returnUrl.indexOf("?")>=0?"&":"?",a=latestAlliance;
    location.href=returnUrl+sep+"allianceId="+encodeURIComponent(a&&a.id||"")+
      "&allianceCode="+encodeURIComponent(a&&a.code||"")+
      "&allianceOwner="+encodeURIComponent(a&&a.owner_player_id||"")+
      "&allianceMembers="+encodeURIComponent(a&&a.member_count||"")+
      "&allianceBuildingLevel="+encodeURIComponent(latestBuildingLevel)+
      "&allianceSnapshot="+encodeURIComponent(JSON.stringify({id:a&&a.id||"",code:a&&a.code||"",memberCount:a&&a.member_count||0,construction:latestConstruction||{},buildings:latestBuildings||[],members:latestMembers||[]}));
  });
};
refresh();loadTasks();
})();</script></body></html>
