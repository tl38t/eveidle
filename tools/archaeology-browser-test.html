<!--
  考古系统浏览器验收页（iframe 模式）
  通过 iframe 加载真实 index.html，在 iframe.contentWindow 中操作真实游戏代码和 DOM。
  用法：浏览器打开 http://localhost:PORT/tools/archaeology-browser-test.html（PORT 来自 serve 本地的端口）
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>考古系统浏览器验收</title>
<style>
body { font-family: monospace; background: #0a0f18; color: #c8d8e8; padding: 20px; }
h1 { color: #d4a843; }
h2 { color: #8ac8ff; font-size: 14px; margin-top: 20px; }
.pass { color: #4ac87a; }
.fail { color: #e05555; }
.log { margin: 4px 0; font-size: 13px; }
.section { margin: 16px 0; padding: 8px; border-left: 2px solid #2a3a4a; }
#frame-box { border: 1px solid #2a3a4a; margin: 12px 0; }
#frame-box iframe { width: 100%; height: 600px; border: none; background: #0a0f18; }
summary { cursor: pointer; font-weight: bold; margin-bottom: 8px; }
.btn { background:#1a2a3a; color:#c8d8e8; border:1px solid #2a3a4a; padding:4px 12px; cursor:pointer; margin:4px; border-radius:3px; }
.btn:hover { background:#2a3a4a; }
</style>
</head>
<body>
<h1>🛰 考古系统浏览器验收</h1>
<p style="color:#6a7a8e;font-size:13px;">通过 iframe 加载真实 index.html，测试全链路</p>
<button class="btn" onclick="runAll()">▶ 运行全部测试</button>
<button class="btn" onclick="clearLog()">清空日志</button>
<div id="frame-box"><iframe id="game-frame" src="../index.html"></iframe></div>
<div id="output"></div>

<script>
var out = document.getElementById("output");
var pass = 0, fail = 0, total = 0;
var tests = [];

function log(msg, cls) { var d = document.createElement("div"); d.className = "log " + (cls || ""); d.textContent = msg; out.appendChild(d); }
function clearLog() { out.innerHTML = ""; pass = 0; fail = 0; total = 0; }

function test(name, fn) {
  tests.push(function(win) {
    try {
      var result = fn(win);
      if (result === true || result === undefined) { pass++; log("✅ " + name, "pass"); }
      else { fail++; log("❌ " + name + " → " + result, "fail"); }
    } catch(e) {
      fail++; log("❌ " + name + " → 异常: " + e.message, "fail");
    }
    total++;
  });
}

function runAll() {
  clearLog();
  var iframe = document.getElementById("game-frame");
  var win = iframe.contentWindow;
  if (!win || !win.gameState) { log("⏳ iframe 未加载完成，等待..."); setTimeout(function(){runAll();}, 500); return; }
  log("=== " + tests.length + " 项测试 ===", "section");
  for (var i = 0; i < tests.length; i++) tests[i](win);
  log("\n==== 结果: " + pass + "/" + total + " 通过, " + fail + " 失败 ===", "section");
}

// ========== 测试用例 ==========

test("iframe 加载完成且 gameState 存在", function(win) {
  return win.gameState && typeof win.gameState === "object" ? true : "gameState 不存在";
});

test("ARCHAEOLOGY_SITES 15 条", function(win) {
  return win.ARCHAEOLOGY_SITES && win.ARCHAEOLOGY_SITES.length === 15 ? true : "ARCHAEOLOGY_SITES.length=" + (win.ARCHAEOLOGY_SITES ? win.ARCHAEOLOGY_SITES.length : "undef");
});

test("archaeology-panel 存在 HTML", function(win) {
  return win.document.getElementById("archaeology-panel") !== null ? true : "panel 不存在";
});

test("导航到考古页面", function(win) {
  win.switchPage("archaeology");
  var panel = win.document.getElementById("archaeology-panel");
  return panel && panel.style.display !== "none" ? true : "panel 不可见";
});

test("分配考古舰", function(win) {
  var G = win.gameState, RR = win.ResourceRegistry, r;
  RR.add(G, "consumable:fuel", 500);
  RR.add(G, "probe:core_probe_i", 50);
  if (!G.skills.archaeology) G.skills.archaeology = { lvl:1, xp:0 };
  if (!G.inventory.ships) G.inventory.ships = [];
  var ship = win.createShipInstance("heron");
  G.inventory.ships.push(ship);
  r = win.dispatchGameAction(G, { type:"hangar/toggleAssignment", instanceId:ship.instanceId, actionKey:"archaeology" }, Date.now());
  return r.changed ? true : "分配失败: " + r.reason;
});

test("选择遗迹", function(win) {
  var r = win.dispatchGameAction(win.gameState, { type:"archaeology/selectSite", siteId:"site_i_a" }, Date.now());
  return r.changed ? true : "选择失败: " + r.reason;
});

test("选择探针", function(win) {
  var r = win.dispatchGameAction(win.gameState, { type:"archaeology/selectProbe", probeId:"core_probe_i" }, Date.now());
  return r.changed ? true : "选择失败: " + r.reason;
});

test("开始解析 → 真实 Action", function(win) {
  var r = win.dispatchGameAction(win.gameState, { type:"archaeology/start" }, Date.now());
  return r.changed ? true : "开始失败: " + r.reason;
});

test("开始后 skill=archaeology, active=true", function(win) {
  var a = win.gameState.currentAction;
  return a.skill === "archaeology" && a.active ? true : "skill=" + a.skill + " active=" + a.active;
});

test("开始后 lastProgressUpdate 有效", function(win) {
  return win.gameState.currentAction.lastProgressUpdate > 0 ? true : "lastProgressUpdate=" + win.gameState.currentAction.lastProgressUpdate;
});

test("运行中不能切换遗迹", function(win) {
  var r = win.dispatchGameAction(win.gameState, { type:"archaeology/selectSite", siteId:"site_i_b" }, Date.now());
  return r.changed === false && r.reason === "action-running" ? true : "不应成功切换: " + (r.changed ? "changed" : r.reason);
});

test("运行中不能切换探针", function(win) {
  var r = win.dispatchGameAction(win.gameState, { type:"archaeology/selectProbe", probeId:"enhanced_probe_ii" }, Date.now());
  return r.changed === false && r.reason === "action-running" ? true : "不应成功切换: " + (r.changed ? "changed" : r.reason);
});

test("停止解析", function(win) {
  var r = win.dispatchGameAction(win.gameState, { type:"archaeology/stop" }, Date.now() + 2000);
  return r.changed && !win.gameState.currentAction.active ? true : "stop 失败: " + (!r.changed ? r.reason : "active=" + win.gameState.currentAction.active);
});

test("停止后 startedSiteId 清空", function(win) {
  return win.gameState.archaeology.startedSiteId === null ? true : "startedSiteId=" + win.gameState.archaeology.startedSiteId;
});

test("停止后可切换遗迹", function(win) {
  var r = win.dispatchGameAction(win.gameState, { type:"archaeology/selectSite", siteId:"site_i_b" }, Date.now());
  return r.changed ? true : "切换失败: " + r.reason;
});

test("停止后再开始", function(win) {
  // 切回原遗迹
  win.dispatchGameAction(win.gameState, { type:"archaeology/selectSite", siteId:"site_i_a" }, Date.now());
  var r = win.dispatchGameAction(win.gameState, { type:"archaeology/start" }, Date.now() + 3000);
  return r.changed ? true : "再开始失败: " + r.reason;
});

test("缺探针时不能开始", function(win) {
  var G = JSON.parse(JSON.stringify(win.gameState));
  G.archaeology = JSON.parse(JSON.stringify(win.gameState.archaeology));
  G.currentAction = JSON.parse(JSON.stringify(win.gameState.currentAction));
  G.shipAssignments = { archaeology: G.inventory.ships[0] && G.inventory.ships[0].instanceId };
  G.archaeology.activeSiteId = "site_i_a";
  G.archaeology.activeProbeId = "core_probe_i";
  win.ResourceRegistry.spend(G, "probe:core_probe_i", win.ResourceRegistry.get(G, "probe:core_probe_i"));
  if (!G.skills) G.skills = {};
  G.skills.archaeology = { lvl:1, xp:0 };
  var r = win.dispatchGameAction(G, { type:"archaeology/start" }, Date.now());
  return r.changed === false ? true : "缺探针不应成功: " + (r.changed ? "changed" : r.reason);
});

test("缺燃料时不能开始", function(win) {
  var G = JSON.parse(JSON.stringify(win.gameState));
  G.archaeology = JSON.parse(JSON.stringify(win.gameState.archaeology));
  G.currentAction = JSON.parse(JSON.stringify(win.gameState.currentAction));
  G.shipAssignments = { archaeology: G.inventory.ships[0] && G.inventory.ships[0].instanceId };
  G.archaeology.activeSiteId = "site_i_a";
  G.archaeology.activeProbeId = "core_probe_i";
  win.ResourceRegistry.add(G, "probe:core_probe_i", 10);
  win.ResourceRegistry.spend(G, "consumable:fuel", win.ResourceRegistry.get(G, "consumable:fuel"));
  if (!G.skills) G.skills = {};
  G.skills.archaeology = { lvl:1, xp:0 };
  var r = win.dispatchGameAction(G, { type:"archaeology/start" }, Date.now());
  return r.changed === false ? true : "缺燃料不应成功: " + (r.changed ? "changed" : r.reason);
});

test("稀有率无增强时不显示增强", function(win) {
  var disp = win.getArchaeologyDisplayState(win.gameState, Date.now());
  for (var i = 0; i < disp.sites.length; i++) {
    var d = disp.sites[i].drops;
    if (d && Number(d.unique.ratePct) !== Number(d.unique.boostedPct)) {
      return "site " + disp.sites[i].id + " ratePct=" + d.unique.ratePct + " boostedPct=" + d.unique.boostedPct + " (应相等, 无 booster)";
    }
  }
  return true;
});

test("装载 rare 增强剂后概率提升", function(win) {
  var G = win.gameState;
  G.boosters.active = G.boosters.active || {};
  G.boosters.active.archaeologyRare = { itemId:"booster:artifact_tracer_n", remainingMs:180000 };
  var disp = win.getArchaeologyDisplayState(G, Date.now());
  var site0 = disp.sites[0];
  var boosted = Number(site0.drops.unique.boostedPct);
  var base = Number(site0.drops.unique.ratePct);
  // 清除避免污染后续测试
  G.boosters.active.archaeologyRare = null;
  return boosted > base ? true : "boosted(" + boosted + ") <= base(" + base + ")";
});

test("bar-archaeology canvas 存在（页面切换到考古时创建）", function(win) {
  win.switchPage("archaeology");
  var canvas = win.document.getElementById("bar-archaeology");
  return canvas !== null ? true : "bar-archaeology canvas 不存在";
});

test("确认弹窗存在", function(win) {
  var modal = win.document.getElementById("action-modal");
  return modal !== null ? true : "action-modal 不存在";
});

test("bar-archaeology 是 canvas", function(win) {
  var canvas = win.document.getElementById("bar-archaeology");
  return canvas && canvas.tagName === "CANVAS" ? true : "不是 canvas 元素";
});

test("queue/add + queue/start 考古完整路径", function(win) {
  var G = win.gameState;
  var RR = win.ResourceRegistry;
  // 先停止当前行动
  if (G.currentAction.active) win.dispatchGameAction(G, { type:"archaeology/stop" }, Date.now());
  // 确保资源充足
  RR.spend(G, "probe:core_probe_i", RR.get(G, "probe:core_probe_i"));
  RR.spend(G, "consumable:fuel", RR.get(G, "consumable:fuel"));
  RR.add(G, "probe:core_probe_i", 50);
  RR.add(G, "consumable:fuel", 500);
  // 设置考古岗位
  var ship = win.createShipInstance("heron");
  if (!Array.isArray(G.inventory.ships)) G.inventory.ships = [];
  G.inventory.ships.push(ship);
  G.shipAssignments = G.shipAssignments || {};
  G.shipAssignments.archaeology = ship.instanceId;
  // 选择遗迹和探针
  G.archaeology.activeSiteId = "site_i_a";
  G.archaeology.activeProbeId = "core_probe_i";
  // 通过队列系统启动
  var qr = win.dispatchGameAction(G, { type:"queue/add", item:{ skill:"archaeology", target:"site_i_a", label:"site_i_a", count:1 }, front:true }, Date.now());
  if (!qr.changed) return "queue/add 失败: " + qr.reason;
  var sr = win.dispatchGameAction(G, { type:"queue/start" }, Date.now());
  return sr.changed && G.currentAction.active && G.currentAction.skill === "archaeology" ? true : "队列考古启动失败: " + (sr.reason || "active=" + G.currentAction.active + " skill=" + G.currentAction.skill);
});

test("增强剂制造按钮触发的行动确认弹窗", function(win) {
  // 设置资源和默认配方
  var G = win.gameState;
  var RR = win.ResourceRegistry;
  RR.add(G, "planetary:重金属", 100);
  RR.add(G, "special:战术残液", 100);
  G.currentAction.boosterRecipeTarget = "mining_lubricant_n";
  // 验证条件
  var disp = win.getBoosterManufacturingDisplayState(G, Date.now());
  if (!disp) return "getBoosterManufacturingDisplayState 返回 null";
  return disp.canStart ? true : "canStart=false, 需检查材料是否足够";
});

test("考古周期时间含增强剂倍率", function(win) {
  var G = win.gameState;
  var disp = win.getArchaeologyDisplayState(G, Date.now());
  var confirmDisp = win.getActionConfirmationDisplayState(G, "archaeology", Date.now());
  // 无增强剂时 duration = site.time * 1
  var site = disp.sites.find(s => s.id === "site_i_a");
  return site && Math.abs(confirmDisp.duration - site.time) < 0.01 ? true : "duration=" + confirmDisp.duration + " != site.time=" + (site ? site.time : "undef");
});

// ========== 初始自动运行 ==========
window.addEventListener("load", function() { setTimeout(runAll, 1000); });
</script>
</body>
</html>
