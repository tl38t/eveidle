<!--
  空间站系统浏览器验收页（Phase 3C-8）
  通过 iframe 加载真实 index.html，在 iframe.contentWindow 中操作真实游戏代码和 DOM。
  用法：浏览器打开 http://localhost:PORT/tools/station-browser-test.html（PORT 来自 serve 本地的端口）
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>空间站浏览器验收</title>
<style>
body { font-family: monospace; background: #0a0f18; color: #c8d8e8; padding: 20px; }
h1 { color: #d4a843; }
h2 { color: #8ac8ff; font-size: 14px; margin-top: 20px; }
.pass { color: #4ac87a; }
.fail { color: #e05555; }
.warn { color: #d4a843; }
.log { margin: 4px 0; font-size: 13px; }
.section { margin: 16px 0; padding: 8px; border-left: 2px solid #2a3a4a; }
#frame-box { border: 1px solid #2a3a4a; margin: 12px 0; }
#frame-box iframe { width: 100%; height: 800px; border: none; background: #0a0f18; }
summary { cursor: pointer; font-weight: bold; margin-bottom: 8px; }
.btn { background:#1a2a3a; color:#c8d8e8; border:1px solid #2a3a4a; padding:4px 12px; cursor:pointer; margin:4px; border-radius:3px; }
.btn:hover { background:#2a3a4a; }
</style>
</head>
<body>
<h1>🛸 空间站浏览器验收（Phase 3C-8）</h1>
<p style="color:#6a7a8e;font-size:13px;">通过 iframe 加载真实 index.html，测试全链路</p>
<button class="btn" onclick="runAll()">▶ 运行全部测试</button>
<button class="btn" onclick="clearLog()">清空日志</button>
<div id="frame-box"><iframe id="game-frame" src="../index.html"></iframe></div>
<div id="output"></div>

<script>
var out = document.getElementById("output");
var pass = 0, fail = 0, skip = 0, total = 0;
var consoleErrors = 0, pageErrors = 0, rejections = 0, resourceErrors = 0;
var tests = [];

function log(msg, cls) { var d = document.createElement("div"); d.className = "log " + (cls || ""); d.textContent = msg; out.appendChild(d); }
function clearLog() {
  out.innerHTML = ""; pass = 0; fail = 0; skip = 0; total = 0;
  consoleErrors = 0; pageErrors = 0; rejections = 0; resourceErrors = 0;
}

function test(name, fn) {
  tests.push(function(win) {
    try {
      var result = fn(win);
      if (result === true || result === undefined) { pass++; log("✅ " + name, "pass"); }
      else { fail++; log("❌ " + name + " → " + result, "fail"); }
    } catch(e) {
      fail++; log("❌ " + name + " → 异常: " + e.message + (e.stack ? " at " + e.stack.split("\n")[1] : ""), "fail");
    }
    total++;
  });
}

function runAll() {
  clearLog();
  var iframe = document.getElementById("game-frame");
  var win = iframe.contentWindow;
  if (!win || !win.gameState) { log("⏳ iframe 未加载完成，等待..."); setTimeout(function(){runAll();}, 500); return; }
  log("=== " + tests.length + " 项测试 ===", "section");
  // 收集控制台/页面/资源错误
  var origOnError = win.onerror;
  win.onerror = function(msg, url, line) { pageErrors++; return false; };
  var origOnRejection = win.onunhandledrejection;
  win.onunhandledrejection = function() { rejections++; };
  // 劫持 console.error
  var origConsoleError = win.console.error;
  win.console.error = function() { consoleErrors++; origConsoleError.apply(win, arguments); };
  for (var i = 0; i < tests.length; i++) tests[i](win);
  // 恢复钩子
  win.onerror = origOnError;
  win.onunhandledrejection = origOnRejection;
  win.console.error = origConsoleError;
  log("", "section");
  log("控制台错误: " + consoleErrors + " 页面错误: " + pageErrors + " 未捕获rejection: " + rejections + " 资源错误: " + resourceErrors, "");
  log("==== 结果: PASS=" + pass + " FAIL=" + fail + " SKIP=" + skip + " 总共=" + total + " ====", "section");
  if (fail === 0 && skip === 0 && consoleErrors === 0 && pageErrors === 0 && rejections === 0 && resourceErrors === 0) {
    log("★★★★★ RESULT=PASS ★★★★★", "pass");
  } else {
    log("RESULT=FAIL", "fail");
    if (skip > 0) log("  SKIP 必须为 0", "warn");
  }
}

// ========== 辅助函数 ==========

function G(win) { return win.gameState; }

function setupBasicStation(win) {
  var g = win.gameState;
  // 先备足资金与材料：全新存档（无头浏览器为干净 profile）没有 ISK 时
  // startBodyConstruction 会返回 changed=false，construction 保持 null，
  // 后续 construction.completesAt 赋值会抛 TypeError 拖垮整批用例。
  var RR = win.ResourceRegistry;
  RR.set(g, "currency:isk", 1000000000);
  RR.set(g, "mineral:三钛合金", 500000);
  RR.set(g, "mineral:类银超金属", 100000);
  RR.set(g, "mineral:类晶体胶矿", 100000);
  RR.set(g, "mineral:同位聚合体", 100000);
  RR.set(g, "mineral:超新星诺克石", 100000);
  RR.set(g, "mineral:基腹断岩", 100000);
  RR.set(g, "mineral:超噬矿", 100000);
  RR.set(g, "consumable:fuel", 5000000);
  // 自动线（冶炼）消耗矿石（consumeOre），非矿物；不备足会导致首拍即 insufficient-materials 停线、progress 冻结。
  RR.set(g, "ore:凡晶石", 100000);
  RR.set(g, "ore:灼烧岩", 100000);
  RR.set(g, "ore:水硼砂", 100000);
  RR.set(g, "ore:斜长岩", 100000);
  RR.set(g, "ore:干焦岩", 100000);
  RR.set(g, "ore:灰岩", 100000);
  RR.set(g, "ore:艾克诺岩", 100000);
  // 建筑升级（Lv.1 共用成本表）所需耗材：补到远超计划量，避免 insufficient-materials。
  RR.set(g, "moon:镓", 2000);
  RR.set(g, "gas:稳定富勒烯", 2000);
  RR.set(g, "planetary:同位素", 2000);
  RR.set(g, "planetary:生物质", 2000);
  // 维护燃料
  if (!g.station.maintenance) g.station.maintenance = { tier: "standard", fuelRemaining: 500000, lastTick: Date.now() };
  else g.station.maintenance.fuelRemaining = 500000;
  g.station.maintenance.lastTick = Date.now();
  // 升级本体到 Lv.3（资金已就位；加 guard 防止建设失败时死循环）
  var guard = 0;
  while (g.station.bodyLevel < 3 && guard++ < 10) {
    var rBody = win.dispatchGameAction(g, { type: "station/startBodyConstruction" }, Date.now() - 3600000);
    if (!rBody || !rBody.changed || !g.station.construction) break;
    g.station.construction.completesAt = Date.now() - 1000;
    win.completeStationConstruction(g, { offline: false });
  }
  g.station.bodyLevel = 3;
  g.station.construction = null;
  // 加技能
  if (!g.skills.refining) g.skills.refining = { lvl: 80, xp: 0 };
  else g.skills.refining.lvl = 80;
  if (!g.skills.equipmentEngineering) g.skills.equipmentEngineering = { lvl: 80, xp: 0 };
  else g.skills.equipmentEngineering.lvl = 80;
  if (!g.skills.boosterEngineering) g.skills.boosterEngineering = { lvl: 80, xp: 0 };
  else g.skills.boosterEngineering.lvl = 80;
  if (!g.skills.shipEngineering) g.skills.shipEngineering = { lvl: 80, xp: 0 };
  else g.skills.shipEngineering.lvl = 80;
  // 重置自动线
  g.station.autoLines = {
    smelting: { enabled: false, operatorId: null, selectedTargetId: null, startedTargetId: null, progress: 0, lastTick: 0, stoppedReason: null },
    equipment: { enabled: false, operatorId: null, selectedTargetId: null, startedTargetId: null, progress: 0, lastTick: 0, stoppedReason: null },
    booster: { enabled: false, operatorId: null, selectedTargetId: null, startedTargetId: null, progress: 0, lastTick: 0, stoppedReason: null }
  };
  // 重置建筑
  for (var id of ["resource_dispatch","planetary_control","smelting_refinery","equipment_factory","booster_factory","archaeology_lab","combat_command","shipyard"]) {
    g.station.buildings[id] = 0;
  }
  // 测试夹具：确保军团名称合法（全新档默认可能为空，影响 display.corporation.name 校验）。
  if (!g.corporation) g.corporation = {};
  if (typeof g.corporation.name !== "string" || g.corporation.name === "") g.corporation.name = "测试军团";
  g.station.construction = null;
}

function buildAllLv2(win) {
  var g = win.gameState;
  for (var id of ["resource_dispatch","planetary_control","smelting_refinery","equipment_factory","booster_factory","archaeology_lab","combat_command","shipyard"]) {
    g.station.buildings[id] = 2;
  }
}

function getDisplay(win) {
  return win.getStationPageDisplayState(win.gameState, Date.now());
}

// 单调递增测试时钟：每次推进 5s，确保跨用例的 live updater 节流（1000ms）不被误触发。
// 无头环境下虚拟时间在本页同步执行期间基本冻结，故靠 offset 保证严格递增。
var _testNowOffset = 0;
function nextNow(win) {
  _testNowOffset += 5000;
  return Date.now() + _testNowOffset;
}

// 从「周期 Xs · 进度 Y%」（无冒号，空格分隔）或「进度：Y%」（研究页全角冒号）解析百分比整数
function parsePct(text) {
  var m = (text || "").match(/进度\s*[:：]?\s*(\d+)%/);
  return m ? parseInt(m[1], 10) : NaN;
}

// 从「建设中 · 剩余 Xh Ym Zs」解析剩余秒数
function parseRemain(text) {
  var t = text || "";
  var m = t.match(/剩余\s+([\d.]+)h\s*([\d.]+)m\s*([\d.]+)s/);
  if (m) return Number(m[1]) * 3600 + Number(m[2]) * 60 + Number(m[3]);
  var m2 = t.match(/剩余\s+([\d.]+)m\s*([\d.]+)s/);
  if (m2) return Number(m2[1]) * 60 + Number(m2[2]);
  var m3 = t.match(/剩余\s+([\d.]+)s/);
  if (m3) return Number(m3[1]);
  return NaN;
}

// 从真实显示态取 smelting 配方名，避免依赖未挂 window 的 SMELTING_RECIPES。
// smelting 的 keyFn = r.name，targetOptions[i].value 即配方名（稳定内部标识）。
function smeltTargetNames(win) {
  var d = getDisplay(win);
  if (!d || !d.autoLines) return null;
  var al = null;
  for (var i = 0; i < d.autoLines.length; i++) if (d.autoLines[i].lineId === "smelting") al = d.autoLines[i];
  if (!al || !al.targetOptions || !al.targetOptions.length) return null;
  var a = al.targetOptions[0];
  var b = al.targetOptions.length > 1 ? al.targetOptions[1] : a;
  return { nameA: a.id, nameB: b.id }; // smelting keyFn = r.name，targetOptions 字段为 id（= recipe.name）
}

// 取冶炼自动线真实周期秒数（UI 与结算共用公式，见 station.js getStationAutoLineCycleDuration）。
// 仅在 line 已设置 startedTargetId 后调用才有效（matchedRecipe 才能命中）。
function getSmeltCycleSec(win) {
  var d = getDisplay(win);
  if (!d || !d.autoLines) return 0;
  for (var i = 0; i < d.autoLines.length; i++) {
    if (d.autoLines[i].lineId === "smelting") return (d.autoLines[i].cycleDurationMs || 0) / 1000;
  }
  return 0;
}

function hasNaN(obj, path) {
  if (obj === undefined) return path + "=undefined";
  if (obj === null) return null;
  if (typeof obj === "number") {
    if (!Number.isFinite(obj)) return path + "=" + obj;
    return null;
  }
  if (typeof obj === "object") {
    if (Array.isArray(obj)) {
      for (var i = 0; i < obj.length; i++) {
        var r = hasNaN(obj[i], path + "[" + i + "]");
        if (r) return r;
      }
      return null;
    }
    if (obj !== null) {
      for (var k in obj) {
        if (obj.hasOwnProperty(k)) {
          var r = hasNaN(obj[k], path + "." + k);
          if (r) return r;
        }
      }
    }
    return null;
  }
  return null;
}

// ========== 测试用例 ==========

// ---- A区: 基本存在性 ----
test("iframe 加载完成且 gameState 存在", function(win) {
  return win.gameState && typeof win.gameState === "object" ? true : "gameState 不存在";
});

test("station 系统已加载", function(win) {
  return typeof win.getStationPageDisplayState === "function" ? true : "getStationPageDisplayState 不存在";
});

test("getStationPageDisplayState 不抛异常", function(win) {
  try {
    var d = getDisplay(win);
    return d ? true : "返回 null";
  } catch(e) { return "抛异常: " + e.message; }
});

// ---- B区: 本体建设 ----
test("本体建设 Lv.1", function(win) {
  setupBasicStation(win);
  var g = G(win);
  g.station.bodyLevel = 0;
  g.station.construction = null;
  var r = win.dispatchGameAction(g, { type: "station/startBodyConstruction" }, Date.now());
  return r.changed ? true : "startBodyConstruction 返回 changed=false, reason=" + r.reason;
});

test("重复建设本体原子拒绝", function(win) {
  var g = G(win);
  var r = win.dispatchGameAction(g, { type: "station/startBodyConstruction" }, Date.now());
  return r.changed === false ? true : "重复建设应拒绝, 返回 " + JSON.stringify(r);
});

// ---- C区: 建筑 ----
test("建筑升级 smelting_refinery Lv.1", function(win) {
  setupBasicStation(win);
  var g = G(win);
  g.station.buildings.smelting_refinery = 0;
  g.station.construction = null;
  var r = win.dispatchGameAction(g, { type: "station/startBuildingConstruction", buildingId: "smelting_refinery" }, Date.now());
  return r.changed ? true : "建筑升级返回 changed=false, reason=" + r.reason;
});

test("建筑等级 ≤ 本体等级", function(win) {
  setupBasicStation(win);
  var g = G(win);
  g.station.bodyLevel = 1;
  g.station.buildings.smelting_refinery = 1; // 等于本体 level
  g.station.construction = null;
  var r = win.dispatchGameAction(g, { type: "station/startBuildingConstruction", buildingId: "smelting_refinery" }, Date.now());
  return r.changed === false && r.reason === "body-level-cap" ? true : "应 body-level-cap, 返回 " + JSON.stringify(r);
});

// ---- D区: 维护 ----
test("维护补给 canRefill", function(win) {
  setupBasicStation(win);
  var g = G(win);
  g.station.maintenance.fuelRemaining = 100; // 极少，需要补给
  var refillState = win.getStationRefillMaintenanceState(g);
  return refillState.canRefill ? true : "应可以补给, 返回 " + JSON.stringify(refillState);
});

test("一键补给执行", function(win) {
  var g = G(win);
  g.station.maintenance.fuelRemaining = 100;
  g.station.maintenance.lastTick = Date.now() - 10000;
  var r = win.dispatchGameAction(g, { type: "station/refillMaintenance" }, Date.now());
  return r.changed ? true : "补给失败, reason=" + r.reason;
});

// ---- E区: 显示态 ----
test("8 建筑内容非空", function(win) {
  setupBasicStation(win);
  buildAllLv2(win);
  var d = getDisplay(win);
  if (!d || !Array.isArray(d.buildings)) return "buildings 非数组";
  if (d.buildings.length !== 8) return "buildings.length=" + d.buildings.length;
  for (var i = 0; i < d.buildings.length; i++) {
    if (!d.buildings[i].name || d.buildings[i].name === "") return "buildings[" + i + "].name 为空";
    if (!d.buildings[i].effectText || d.buildings[i].effectText === "") return "buildings[" + i + "].effectText 为空";
  }
  return true;
});

test("3 自动线目标非空", function(win) {
  setupBasicStation(win);
  var g = G(win);
  g.station.buildings.smelting_refinery = 2;
  g.station.buildings.equipment_factory = 2;
  g.station.buildings.booster_factory = 2;
  g.skills.refining.lvl = 80;
  g.skills.equipmentEngineering.lvl = 80;
  g.skills.boosterEngineering.lvl = 80;
  g.station.autoLines.smelting.selectedTargetId = null;
  g.station.autoLines.equipment.selectedTargetId = null;
  g.station.autoLines.booster.selectedTargetId = null;
  var d = getDisplay(win);
  if (!d || !Array.isArray(d.autoLines)) return "autoLines 非数组";
  if (d.autoLines.length !== 3) return "autoLines.length=" + d.autoLines.length;
  for (var i = 0; i < d.autoLines.length; i++) {
    var al = d.autoLines[i];
    if (!Array.isArray(al.targetOptions) || al.targetOptions.length === 0) return al.lineId + " targetOptions 为空";
    if (!al.name || al.name === "") return al.lineId + " name 为空";
  }
  return true;
});

test("自动线 A→启动→选择B，运行目标仍A", function(win) {
  setupBasicStation(win);
  var g = G(win);
  g.station.buildings.smelting_refinery = 2;
  g.skills.refining.lvl = 80;
  // 配方名取自真实显示态 targetOptions（smelting keyFn = r.name，value 即配方名），
  // 不依赖未挂 window 的 SMELTING_RECIPES。
  var names = smeltTargetNames(win);
  if (!names) return "无法取得 smelting 配方名（targetOptions 为空）";
  var nameA = names.nameA, nameB = names.nameB;
  // 选择A
  win.dispatchGameAction(g, { type: "station/selectAutoLineTarget", lineId: "smelting", targetId: nameA }, Date.now());
  if (g.station.autoLines.smelting.selectedTargetId !== nameA) return "select " + nameA + " 失败";
  // 启动A
  var startR = win.dispatchGameAction(g, { type: "station/startAutoLine", lineId: "smelting" }, Date.now());
  if (!startR.changed) return "startAutoLine 失败, reason=" + startR.reason;
  if (g.station.autoLines.smelting.startedTargetId !== nameA) return "startedTargetId 不是 " + nameA;
  // 选择B
  win.dispatchGameAction(g, { type: "station/selectAutoLineTarget", lineId: "smelting", targetId: nameB }, Date.now());
  // startedTargetId 仍为 A
  if (g.station.autoLines.smelting.startedTargetId !== nameA) return "startedTargetId 应仍为 " + nameA + " 但为 " + g.station.autoLines.smelting.startedTargetId;
  if (g.station.autoLines.smelting.selectedTargetId !== nameB) return "selectedTargetId 应为 " + nameB;
  return true;
});

test("停止重启后运行目标变B", function(win) {
  var g = G(win);
  var names = smeltTargetNames(win);
  if (!names) return "无法取得 smelting 配方名（targetOptions 为空）";
  var nameB = names.nameB;
  // 停止
  win.dispatchGameAction(g, { type: "station/stopAutoLine", lineId: "smelting" }, Date.now());
  if (g.station.autoLines.smelting.enabled) return "停止后 enabled 仍为 true";
  // selectedTargetId 已为 B（上一步设置），启动后 startedTargetId 应为 B
  g.station.autoLines.smelting.stoppedReason = null;
  var startR = win.dispatchGameAction(g, { type: "station/startAutoLine", lineId: "smelting" }, Date.now());
  if (!startR.changed) return "重启失败, reason=" + startR.reason;
  if (g.station.autoLines.smelting.startedTargetId !== nameB) return "重启后 startedTargetId 应变为 " + nameB + " 但为 " + g.station.autoLines.smelting.startedTargetId;
  return true;
});

test("自动线周期和进度有效", function(win) {
  setupBasicStation(win);
  var g = G(win);
  g.station.buildings.smelting_refinery = 2;
  g.skills.refining.lvl = 80;
  var names = smeltTargetNames(win);
  if (!names) return "无法取得 smelting 配方名（targetOptions 为空）";
  var name = names.nameA;
  g.station.autoLines.smelting.selectedTargetId = name;
  g.station.autoLines.smelting.startedTargetId = name;
  g.station.autoLines.smelting.enabled = true;
  g.station.autoLines.smelting.stoppedReason = null;
  g.station.autoLines.smelting.progress = 10;
  g.station.autoLines.smelting.lastTick = Date.now() - 5000;
  var d = getDisplay(win);
  var smeltAL = null;
  for (var i = 0; i < d.autoLines.length; i++) {
    if (d.autoLines[i].lineId === "smelting") smeltAL = d.autoLines[i];
  }
  if (!smeltAL) return "无 smelting 自动线";
  if (!Number.isFinite(smeltAL.cycleDurationMs) || smeltAL.cycleDurationMs <= 0) return "cycleDurationMs 无效";
  if (!Number.isFinite(smeltAL.progressRatio) || smeltAL.progressRatio < 0) return "progressRatio 无效";
  return true;
});

test("断油七建筑停效、船坞例外", function(win) {
  setupBasicStation(win);
  var g = G(win);
  buildAllLv2(win);
  g.station.maintenance.fuelRemaining = 0;
  var d = getDisplay(win);
  if (!d || !d.effects) return "effects 不存在";
  var foundShipyard = false, foundSmelt = false;
  for (var i = 0; i < d.effects.length; i++) {
    var e = d.effects[i];
    if (e.id === "shipyard") foundShipyard = true;
    if (e.id === "smelting") foundSmelt = true;
    if (e.id === "shipyard" && e.active !== true) return "船坞断油应 active=false? active=" + e.active;
    if (e.id !== "logistics" && e.id !== "shipyard" && e.active === true && g.station.maintenance.fuelRemaining === 0) {
      // 注: logistics 也是断油停效（只依赖本体和燃料），所以不检查 logistics
    }
  }
  if (!foundShipyard) return "全无 shipyard 效果行";
  if (!foundSmelt) return "全无 smelting 效果行";
  // 船坞例外：断油仍 active
  var shipyardEff = d.effects.find(function(e) { return e.id === "shipyard"; });
  var smeltEff = d.effects.find(function(e) { return e.id === "smelting"; });
  var logEff = d.effects.find(function(e) { return e.id === "logistics"; });
  if (!shipyardEff || !smeltEff || !logEff) return "缺少效果行";

test("页面可滚动（真实滚动行为验证）", function(win) {
  var doc = win.document;
  var body = doc.body;
  if (!body) return "无 body";
  // 父文档控件：缩小 iframe 到小视口（模拟小窗/移动端），制造真实溢出。
  // 测试函数运行在父页上下文，document 即父文档，可操作承载 iframe 的 #game-frame。
  var frame = document.getElementById("game-frame");
  var prevH = frame ? frame.style.height : "";
  if (frame) frame.style.height = "320px";

  // 找真实滚动容器：从已知站内内容锚点向上找 overflow-y:auto/scroll 的祖先；
  // 找不到则回退为全文档扫描中 scrollHeight 最大的可滚动元素。
  function findScroller() {
    var anchor = doc.getElementById("station-auto-lines") || doc.getElementById("station-buildings-grid") || body;
    var el = anchor;
    while (el && el !== doc.documentElement) {
      var cs = null; try { cs = win.getComputedStyle(el); } catch (e) {}
      if (cs && (cs.overflowY === "auto" || cs.overflowY === "scroll")) return el;
      el = el.parentElement;
    }
    var best = null, bestD = 0;
    var all = [doc.documentElement, body].concat(Array.prototype.slice.call(body.querySelectorAll("*")));
    for (var i = 0; i < all.length; i++) {
      var e = all[i]; var c2 = null; try { c2 = win.getComputedStyle(e); } catch (e2) { continue; }
      if ((c2.overflowY === "auto" || c2.overflowY === "scroll") && e.scrollHeight > e.clientHeight) {
        var d = e.scrollHeight - e.clientHeight;
        if (d > bestD) { bestD = d; best = e; }
      }
    }
    return best;
  }
  var sc = findScroller();
  if (!sc) { if (frame) frame.style.height = prevH; return "未找到可滚动容器"; }
  // 注入测试夹具内容（不影响正式游戏布局）：足够高度以产生溢出，证明页面真实可滚动。
  var probe = doc.getElementById("__scroll_probe__");
  if (!probe) {
    probe = doc.createElement("div");
    probe.id = "__scroll_probe__";
    probe.style.cssText = "height:8000px;width:1px;margin:0;padding:0;border:0;background:transparent;";
    sc.appendChild(probe);
  }
  void sc.offsetHeight; // 强制重排
  if (!(sc.scrollHeight > sc.clientHeight)) { if (frame) frame.style.height = prevH; return "注入探针后仍无溢出: scrollHeight=" + sc.scrollHeight + " clientHeight=" + sc.clientHeight; }
  var before = sc.scrollTop || 0;
  var target = Math.min(1500, sc.scrollHeight - sc.clientHeight - 1);
  try { sc.scrollTop = target; } catch (e) {}
  var after = sc.scrollTop || 0;
  if (frame) frame.style.height = prevH;               // 复位 iframe 高度，避免影响后续用例
  if (after > before && after >= before + 100) return true; // 真实滚动：scrollTop 实际增加
  return "真实滚动无效: before=" + before + " after=" + after;
});

// L2 拆为「不跨周期」与「跨周期回绕」两个用例，按真实周期公式断言，
// 避免旧断言（严格 p1>p0）在冶炼周期缩短后误判回绕为失败。
// 真实公式（与 station.js processAutoLines / processSmeltingAutoLine 同源）：
//   cycleTimeSec = recipe.baseTime / efficiency
//   line.progress 单位为「当前周期内已累计秒数」（UI 显示 = progress/cycleTimeSec*100%）
//   推进 elapsedSec 后：expectedSec = (progress0 + elapsedSec) % cycleTimeSec
//   跨过 floor((progress0+elapsedSec)/cycleTimeSec) - floor(progress0/cycleTimeSec) 个完整周期 → 产出增加
test("L2a 自动线进度随真实周期结算单调增加（不跨周期）", function(win) {
  setupBasicStation(win);
  var g = win.gameState;
  g.station.buildings.smelting_refinery = 2;
  g.skills.refining.lvl = 80;
  var names = smeltTargetNames(win);
  if (!names) return "无 smelting 目标";
  var RR = win.ResourceRegistry;
  var PAL = win.processAutoLines || (win.StationSystem && win.StationSystem.processAutoLines);
  if (!PAL) return "processAutoLines 不可用";
  // 先建立 line（startedTargetId 命中配方）再取真实周期
  g.station.autoLines.smelting = { enabled: true, selectedTargetId: names.nameA, startedTargetId: names.nameA, progress: 0, lastTick: 0, stoppedReason: null };
  var cyc = getSmeltCycleSec(win);
  if (!(cyc > 0)) return "无法取得真实周期";
  // 不跨完整周期的小步长（40% 周期）
  var stepSec = cyc * 0.4;
  win.switchPage("station");
  var mineralBefore = RR.get(g, "mineral:三钛合金");
  var T = nextNow(win);
  g.station.autoLines.smelting.lastTick = T - stepSec * 1000;
  PAL(g, T, false);
  win.renderStationPage(T);
  win.updateStationLiveUI(T);
  var line = g.station.autoLines.smelting;
  if (line.stoppedReason) return "意外停线: " + line.stoppedReason;
  if (!(line.enabled && line.startedTargetId && !line.stoppedReason)) return "自动线未处于 running 状态";
  var progSec = Number(line.progress) || 0;
  var expectedSec = (0 + stepSec) % cyc;
  if (Math.abs(progSec - expectedSec) > 0.5) return "进度秒数不符: 实际=" + progSec.toFixed(3) + " 期望=" + expectedSec.toFixed(3);
  if (!(progSec > 0)) return "进度未增加: progSec=" + progSec;
  // 未跨完整周期 → 不应有产出
  var mineralAfter = RR.get(g, "mineral:三钛合金");
  if (mineralAfter !== mineralBefore) return "不跨周期却产出: " + mineralBefore + "→" + mineralAfter;
  // 状态与 DOM 进度条应反映运行中且递增
  var statusEl = win.document.getElementById("al-status-smelting");
  if (statusEl && statusEl.textContent.indexOf("运行中") < 0) return "未显示运行中: " + statusEl.textContent;
  var p1 = parsePct(win.document.getElementById("al-progress-smelting").textContent);
  if (!(p1 > 0)) return "DOM 进度未显示增加: p1=" + p1;
  return true;
});

test("L2b 自动线跨完整周期后进度回绕且产出增加（真实公式）", function(win) {
  setupBasicStation(win);
  var g = win.gameState;
  g.station.buildings.smelting_refinery = 2;
  g.skills.refining.lvl = 80;
  var names = smeltTargetNames(win);
  if (!names) return "无 smelting 目标";
  var RR = win.ResourceRegistry;
  var PAL = win.processAutoLines || (win.StationSystem && win.StationSystem.processAutoLines);
  if (!PAL) return "processAutoLines 不可用";
  // 先建立 line（startedTargetId 命中配方）再取真实周期
  g.station.autoLines.smelting = { enabled: true, selectedTargetId: names.nameA, startedTargetId: names.nameA, progress: 0, lastTick: 0, stoppedReason: null };
  var cyc = getSmeltCycleSec(win);
  if (!(cyc > 0)) return "无法取得真实周期";
  // 初始进度设在周期 80%（高值），推进 1.5 个周期 → 回绕到约 30%，跨过 2 个完整周期
  var initSec = cyc * 0.8;
  var advanceSec = cyc * 1.5;
  g.station.autoLines.smelting.progress = initSec;
  win.switchPage("station");
  var mineralBefore = RR.get(g, "mineral:三钛合金");
  var T = nextNow(win);
  g.station.autoLines.smelting.lastTick = T - advanceSec * 1000;
  PAL(g, T, false);
  win.renderStationPage(T);
  win.updateStationLiveUI(T);
  var line = g.station.autoLines.smelting;
  if (line.stoppedReason) return "意外停线: " + line.stoppedReason;
  if (!(line.enabled && line.startedTargetId && !line.stoppedReason)) return "自动线未处于 running 状态";
  // 真实公式：elapsedProgress% = advanceSec/cyc*100；expectedProgress% = (p0% + elapsedProgress%) % 100
  var p0pct = initSec / cyc * 100;
  var elapsedPct = advanceSec / cyc * 100;
  var expectedPct = (p0pct + elapsedPct) % 100;
  var progSec = Number(line.progress) || 0;
  var actualPct = progSec / cyc * 100;
  if (Math.abs(actualPct - expectedPct) > 2) return "回绕后进度不符: 实际=" + actualPct.toFixed(2) + "% 期望=" + expectedPct.toFixed(2) + "%";
  // 跨过 2 个完整周期（floor(0.8+1.5)-floor(0.8) = 2）→ 产出必须增加
  var mineralAfter = RR.get(g, "mineral:三钛合金");
  if (!(mineralAfter > mineralBefore)) return "跨周期但产出未增加: " + mineralBefore + "→" + mineralAfter;
  // DOM 进度条回绕到约 30%，且应显示运行中
  var statusEl = win.document.getElementById("al-status-smelting");
  if (statusEl && statusEl.textContent.indexOf("运行中") < 0) return "未显示运行中: " + statusEl.textContent;
  var p1 = parsePct(win.document.getElementById("al-progress-smelting").textContent);
  if (Math.abs(p1 - expectedPct) > 3) return "DOM 进度回绕不符: p1=" + p1 + " 期望≈" + expectedPct.toFixed(0);
  return true;
});

  var T1 = T0 + 30000;
  win.updateStationLiveUI(T1);
  var text1 = win.document.getElementById("station-construction-text").textContent;
  var rem0 = parseRemain(text0), rem1 = parseRemain(text1);
  if (isNaN(rem0) || isNaN(rem1)) return "无法解析剩余时间: '" + text0 + "' → '" + text1 + "'";
  if (!(rem1 < rem0)) return "倒计时未减少: '" + text0 + "' → '" + text1 + "'";
  return true;
});

test("L5 本体建造完成后 live 刷新自动更新等级卡片", function(win) {
  setupBasicStation(win);
  var g = win.gameState;
  g.station.bodyLevel = 1;
  g.station.construction = null;
  var r = win.dispatchGameAction(g, { type: "station/startBodyConstruction" }, Date.now());
  if (!r.changed) return "启动本体建设失败: " + r.reason;
  // completeStationConstruction 要求 completesAt > startedAt（fail-closed 时间戳校验），
  // 故同时设置 startedAt 与 completesAt，使 Date.now() >= completesAt 成立。
  g.station.construction.startedAt = Date.now() - 60000;
  g.station.construction.completesAt = Date.now() - 1000; // 令其完成
  win.switchPage("station");
  win.renderStationPage(nextNow(win)); // 同步签名（currentConstruction=true, bodyLevel=1）
  var csRes = win.completeStationConstruction(g, { offline: false }); // 真实完成结算
  if (g.station.bodyLevel !== 2) return "L5: bl=" + g.station.bodyLevel + " cs=" + (csRes && csRes.reason)
    + " c=" + (g.station.construction ? (g.station.construction.targetLevel + ":" + g.station.construction.startedAt + ">" + g.station.construction.completesAt) : "null");
  var tL5 = nextNow(win);
  win.updateStationLiveUI(tL5); // 检测结构变化（currentConstruction=false, bodyLevel=2）→ 整页渲染
  var lvlEl = win.document.getElementById("station-body-level");
  if (!lvlEl) return "无 #station-body-level";
  // 用数字提取做稳健断言（规避全/半角句号等字符编码差异），只要升到 2 级即视为成功
  var lvlDigits = (lvlEl.textContent || "").replace(/[^0-9]/g, "");
  if (lvlDigits !== "2") return "等级卡片未更新为 Lv.2，live=" + lvlEl.textContent + " bl=" + g.station.bodyLevel;
  var ctext = win.document.getElementById("station-construction-text").textContent;
  if (ctext.indexOf("就绪") < 0 && ctext.indexOf("已满级") < 0) return "完成态文本异常: " + ctext;
  return true;
});

test("L6 研究倒计时/进度随真实结算自动变化", function(win) {
  var g = win.gameState;
  if (!g.research) g.research = {};
  var RD = win.getResearchData && win.getResearchData();
  if (!RD || !RD.NODES || !RD.NODES.length) return "无研究节点";
  var techId = RD.NODES[0].id;
  var T0 = nextNow(win);
  g.research.activeResearch = { techId: techId, targetLevel: 1, baseDuration: 600, remainingSeconds: 600, appliedAchievementSeconds: 0, startedAt: T0 };
  g.research.lastProcessedAt = T0;
  g.research.pendingQueue = [];
  g.research.completedLevels = g.research.completedLevels || {};
  win.switchPage("research");
  win.renderResearchPage();
  var now0 = nextNow(win);
  win.updateResearchLiveUI(now0);
  var progEl0 = win.document.getElementById("research-active-progress");
  if (!progEl0) return "无 #research-active-progress";
  var pct0 = parsePct(progEl0.textContent);
  var now1 = now0 + 300000; // 真实推进 5 分钟
  var RS = win.ResearchSystem;
  if (!RS || !RS.processResearchUntil) return "ResearchSystem.processResearchUntil 不可用";
  RS.processResearchUntil(g, now1);
  win.updateResearchLiveUI(now1);
  var progEl1 = win.document.getElementById("research-active-progress");
  var pct1 = parsePct(progEl1.textContent);
  if (!(pct1 > pct0)) return "进度未自动增加: pct0=" + pct0 + " pct1=" + pct1;
  return true;
});

test("L7 研究完成衔接队列显示下一项（processResearchUntil）", function(win) {
  var g = win.gameState;
  var RD = win.getResearchData && win.getResearchData();
  if (!RD || !RD.NODES || !RD.NODES.length) return "无研究节点";
  // 选两个无前置的非协议节点：node1 作起点，node2 作衔接下一项
  var node2 = RD.NODES.find(function(n) {
    var isProto = (n.type === "protocol" || n.category === "protocol");
    return !isProto && (!n.prerequisites || n.prerequisites.length === 0);
  });
  if (!node2) return "找不到无前置的非协议研究节点";
  var techId2 = node2.id;
  var node1 = RD.NODES.find(function(n) {
    var isProto = (n.type === "protocol" || n.category === "protocol");
    return !isProto && (!n.prerequisites || n.prerequisites.length === 0) && n.id !== techId2;
  });
  if (!node1) return "找不到起点研究节点";
  var techId1 = node1.id;
  // 用真实 API 启动 techId1 并真实入队 techId2（enqueue 会做合法校验并写入规范 key，
  // 避免手工拼 key 触发 parseResearchStepKey / getResearchNode 校验失败被静默丢弃）。
  g.research = g.research || {};
  g.research.activeResearch = null;
  g.research.pendingQueue = [];
  g.research.completedLevels = {};
  g.research.lastProcessedAt = 0;
  g.research.researchHourBank = 3600;
  var T0 = nextNow(win);
  var s1 = win.dispatchGameAction(g, { type: "research/start", techId: techId1, targetLevel: 1 }, T0);
  if (!s1 || !s1.changed) return "启动 techId1 失败: " + JSON.stringify(s1);
  var e1 = win.dispatchGameAction(g, { type: "research/enqueue", techId: techId2, targetLevel: 1 }, T0);
  if (!e1 || !e1.changed) return "入队 techId2 失败: " + JSON.stringify(e1);
  win.switchPage("research");
  win.renderResearchPage();
  // 推进足够时间完成 techId1（用真实节点时长 + 余量），但不溢出 techId2
  var dur1 = (win.ResearchSystem && win.ResearchSystem.getResearchDuration) ? win.ResearchSystem.getResearchDuration(techId1, 1) : 600;
  if (!(dur1 > 0)) dur1 = 600;
  var now1 = T0 + (dur1 * 1000 + 20000); // 完成 techId1 并衔接 techId2，但 techId2 未完
  var RS = win.ResearchSystem;
  if (!RS || !RS.processResearchUntil) return "ResearchSystem.processResearchUntil 不可用";
  RS.processResearchUntil(g, now1);
  if (!g.research.activeResearch || g.research.activeResearch.techId !== techId2) {
    return "衔接后 activeResearch 未变为 " + techId2 + " 实际=" + JSON.stringify(g.research.activeResearch)
      + " queue=" + JSON.stringify(g.research.pendingQueue);
  }
  win.updateResearchLiveUI(now1);
  var nameEl = win.document.getElementById("research-active-name");
  if (!nameEl) return "无 #research-active-name: activeResearch=" + JSON.stringify(g.research.activeResearch);
  if (nameEl.textContent.indexOf(node2.name) < 0) return "衔接后未显示下一项 " + node2.name + "，实际=" + nameEl.textContent;
  var queueEl = win.document.getElementById("research-queue");
  if (queueEl && queueEl.textContent.trim() !== "") return "队列应已清空，实际=" + queueEl.textContent;
  return true;
});

test("L8 非当前页不调用 live updater（currentPage 为主门控）", function(win) {
  // currentPage 是 shell-render.js 的词法 let 全局，非 window 属性；
  // 必须通过 switchPage() 切换，直接 win.currentPage= 无效。
  win.switchPage("skill");
  var calledS = false, calledR = false;
  var os = win.updateStationLiveUI, or = win.updateResearchLiveUI;
  if (typeof os !== "function" || typeof or !== "function") return "live updater 未挂载";
  win.updateStationLiveUI = function(n) { calledS = true; return os(n); };
  win.updateResearchLiveUI = function(n) { calledR = true; return or(n); };
  win.updateLiveUI(nextNow(win));
  win.updateStationLiveUI = os;
  win.updateResearchLiveUI = or;
  if (calledS || calledR) return "非当前页仍调用 live updater (station=" + calledS + " research=" + calledR + ")";
  // 反向：切到 station 应当调用
  win.switchPage("station");
  var calledS2 = false;
  win.updateStationLiveUI = function(n) { calledS2 = true; return os(n); };
  win.updateLiveUI(nextNow(win));
  win.updateStationLiveUI = os;
  if (!calledS2) return "切到 station 后未调用 live updater";
  win.switchPage("skill"); // 复位，避免影响后续用例
  return true;
});

test("L9 live updater 不修改 gameState（深比较）", function(win) {
  setupBasicStation(win);
  win.gameState.station.construction = null;
  win.gameState.research = win.gameState.research || {};
  win.gameState.research.activeResearch = null;
  var snap = JSON.stringify({ al: win.gameState.station.autoLines, rs: win.gameState.research });
  for (var i = 0; i < 10; i++) {
    win.updateStationLiveUI(nextNow(win));
    win.updateResearchLiveUI(nextNow(win));
  }
  var snap2 = JSON.stringify({ al: win.gameState.station.autoLines, rs: win.gameState.research });
  return snap === snap2 ? true : "gameState 被 live updater 修改";
});

test("L10 下拉框在 live 刷新中不被重建/丢焦点/丢值", function(win) {
  setupBoosterLine(win);
  var sel = boosterSelect(win);
  if (!sel) return "未找到增强剂下拉框";
  // 先同步一次签名（避免首次 live 刷新触发整页重建把刚聚焦的节点弄丢）
  win.renderStationPage(nextNow(win));
  sel = boosterSelect(win);
  sel.focus();
  var targetVal = sel.options.length ? sel.options[0].value : null;
  if (targetVal === null) return "下拉框无 option";
  sel.value = targetVal;
  var before = { node: sel, value: sel.value, active: win.document.activeElement === sel };
  for (var i = 0; i < 60; i++) win.updateStationLiveUI(nextNow(win));
  var selAfter = boosterSelect(win);
  if (!selAfter) return "刷新后下拉框消失";
  if (selAfter !== before.node) return "下拉框节点被重建（节点身份改变）";
  if (selAfter.value !== before.value) return "下拉框值被重置: " + before.value + " → " + selAfter.value;
  if (win.document.activeElement !== selAfter) return "焦点丢失";
  return true;
});

test("L11 性能确定性：无新定时器 / 节流 / 节点稳定", function(win) {
  setupBasicStation(win);
  var g = win.gameState;
  g.station.buildings.smelting_refinery = 2;
  g.skills.refining.lvl = 80;
  var names = smeltTargetNames(win);
  if (!names) return "无 smelting 目标";
  g.station.autoLines.smelting = { enabled: true, selectedTargetId: names.nameA, startedTargetId: names.nameA, progress: 0, lastTick: 0, stoppedReason: null };
  win.switchPage("station");
  var PAL = win.processAutoLines || (win.StationSystem && win.StationSystem.processAutoLines);
  if (!PAL) return "processAutoLines 不可用";
  function advance(line, now, secs) { line.lastTick = now - secs * 1000; PAL(g, now, false); }

  // (a) 无新 setInterval / setTimeout
  var iv0 = 0, to0 = 0;
  var oi = win.setInterval, ot = win.setTimeout;
  win.setInterval = function() { iv0++; return 0; };
  win.setTimeout = function() { to0++; return 0; };
  for (var i = 0; i < 100; i++) win.updateStationLiveUI(nextNow(win));
  win.setInterval = oi; win.setTimeout = ot;
  if (iv0 !== 0 || to0 !== 0) return "live updater 创建了定时器: setInterval=" + iv0 + " setTimeout=" + to0;

  // (b) 节流：T1（距基线>1000ms）刷新；T2（距T1<1000ms）被节流跳过；T3（距T1>1000ms）刷新
  var alDiv = win.document.getElementById("station-auto-lines");
  if (!alDiv) return "无 #station-auto-lines";
  var progEl = win.document.getElementById("al-progress-smelting");
  if (!progEl) return "无 #al-progress-smelting";
  // 读取实时 gameState 中的 smelting 进度比（与 DOM 渲染同源，避免文本取整/周期回绕造成的误判）
  function smeltRatio(win) {
    var d = win.getStationPageDisplayState(win.gameState, Date.now());
    var al = null;
    (d.autoLines || []).forEach(function(x) { if (x.lineId === "smelting") al = x; });
    return al ? al.progressRatio : null;
  }
  var Tb = nextNow(win);
  advance(g.station.autoLines.smelting, Tb, 5);
  win.updateStationLiveUI(Tb);
  var textBase = progEl.textContent;
  var T1 = Tb + 2000;
  advance(g.station.autoLines.smelting, T1, 5);
  win.updateStationLiveUI(T1);
  var textT1 = progEl.textContent;
  if (textT1 === textBase) return "T1 节流应放开却未刷新（进度应增加）";
  var T2 = T1 + 500; // <1000 → 节流
  advance(g.station.autoLines.smelting, T2, 5);
  win.updateStationLiveUI(T2);
  var textT2 = progEl.textContent;
  if (textT2 !== textT1) return "T2 节流区间内不应刷新: T1=" + textT1 + " T2=" + textT2;
  var T3 = T1 + 2000;
  advance(g.station.autoLines.smelting, T3, 5);
  win.updateStationLiveUI(T3);
  var textT3 = progEl.textContent;
  // T3 未被节流：DOM 必须反映最新 gameState 进度（与实时 gameState 对齐校验，规避回绕后文本相等误判）
  var expectedT3 = smeltRatio(win);
  var domT3 = parsePct(textT3);
  if (isNaN(domT3)) return "T3 解析进度失败: " + textT3;
  if (domT3 !== Math.round(expectedT3 * 100)) return "T3 节流放开后未刷新到最新进度: dom=" + domT3 + "% expected=" + Math.round(expectedT3 * 100) + "%";

  // (c) 子节点数稳定 + booster select 节点身份不变（数百次调用后）
  var sel0 = win.document.querySelector('#station-auto-lines select[data-line="booster"]');
  var c0 = alDiv.childElementCount;
  for (var j = 0; j < 100; j++) win.updateStationLiveUI(nextNow(win));
  var c1 = alDiv.childElementCount;
  var sel1 = win.document.querySelector('#station-auto-lines select[data-line="booster"]');
  if (c0 !== c1) return "alDiv 子节点数变化: " + c0 + " → " + c1;
  if (sel0 && sel1 && sel0 !== sel1) return "booster select 节点被重建";
  return true;
});

// ========== 无头自动运行（供 tools/run-station-browser-test.mjs 采集 EXIT CODE） ==========
// 访问 ?autorun=1 时自动跑全部用例，完成后写入 #autorun-done 供运行器判定。
(function setupAutorun() {
  if (location.search.indexOf("autorun") < 0) return;
  var attempts = 0;
  function tryRun() {
    attempts++;
    var iframe = document.getElementById("game-frame");
    var win = iframe && iframe.contentWindow;
    if ((!win || !win.gameState || typeof win.renderStationPage !== "function") && attempts < 60) {
      setTimeout(tryRun, 250); return;
    }
    try { runAll(); } catch (e) { log("AUTORUN 异常: " + e.message, "fail"); }
    var mark = document.createElement("div");
    mark.id = "autorun-done";
    mark.textContent = "AUTORUN_DONE";
    document.body.appendChild(mark);
  }
  window.addEventListener("load", function() { setTimeout(tryRun, 300); });
})();
