<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>EVE IDLE · ShipFactory2 Player Armor 验证（Fortress Engineering）</title>
  <style>
    :root { color-scheme: dark; --bg:#080608; --text:#e8e4dc; --muted:#9a9086; --orange:#ff9a5a; --steel:#8a8076; }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
      font-family:"Rajdhani","Segoe UI","Microsoft YaHei",sans-serif; overflow:hidden; }
    #app { position:fixed; inset:0; }
    .hud { position:fixed; top:16px; left:16px; pointer-events:none; max-width:62%; }
    .hud h1 { margin:0; font-size:18px; letter-spacing:1px; color:var(--orange); }
    .hud p { margin:4px 0 0; color:var(--muted); font-size:13px; line-height:1.5; }
    .legend { position:fixed; bottom:16px; left:16px; font-size:12px; color:var(--muted); }
    .legend b { color:var(--orange); }
    .tag { position:fixed; transform:translate(-50%,-100%); font-size:12px; padding:3px 9px;
      border:1px solid rgba(255,154,90,.25); border-radius:6px; background:rgba(8,12,18,.88);
      white-space:nowrap; text-align:center; line-height:1.35; }
    .tag .t { color:var(--orange); font-weight:600; }
    .tag .s { color:var(--muted); font-size:11px; }
    .tag.err { border-color:rgba(255,80,80,.5); }
    .tag.err .t { color:#ff6a5a; }
    #error-panel { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
      max-width:80%; max-height:70%; overflow:auto; background:rgba(20,8,8,.96);
      border:1px solid rgba(255,80,80,.4); border-radius:8px; padding:16px 20px;
      font-family:monospace; font-size:13px; line-height:1.5; display:none; z-index:100; }
    #error-panel .title { color:#ff6a5a; font-weight:bold; margin-bottom:8px; }
    #error-panel .stack { color:#e8a098; white-space:pre-wrap; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <div class="hud">
    <h1>ShipFactory2 · Player Armor 验证</h1>
    <p>Fortress Engineering — "不是穿着装甲的船，是被推进器推动的太空堡垒。"<br>
    上排：<b>Player Shield</b>（对比基线）；下排：<b>Player Armor</b>（Fortress Engineering 改造版）<br>
    结构层次：Core Hull → Armor Shell → External Armor Blocks → Surface Details</p>
  </div>
  <div class="legend">调色板：<b>player_armor</b>（米灰装甲/橙色发光）；炮塔系统 · 巨型装甲块 · 半隐藏散热 · 粗糙重甲材质</div>
  <div id="error-panel"></div>

  <script type="module">
    const THREE = await import("three");
    const { OrbitControls } = await import("three/addons/controls/OrbitControls.js");
    const { RoomEnvironment } = await import("three/addons/environments/RoomEnvironment.js");

    // 动态 import ShipFactory2（带时间戳防缓存）
    const { buildShip, COLORS } = await import("./js/render3d/shipfactory2/ShipFactory2.js?v=" + Date.now());

    const app = document.getElementById("app");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080608);
    scene.fog = new THREE.FogExp2(0x080608, 0.005);

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 500);
    camera.position.set(0, 28, 96);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    app.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0, 0);

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    scene.add(new THREE.HemisphereLight(0xc9b8a8, 0x0e0808, 0.40));
    const key = new THREE.DirectionalLight(0xfff4ea, 1.7);
    key.position.set(10, 18, 14); scene.add(key);
    const rim = new THREE.DirectionalLight(0xffd0b0, 0.7);
    rim.position.set(-12, 8, -14); scene.add(rim);

    (function makeStarField(count = 900, radius = 130) {
      const pts = [];
      for (let i = 0; i < count; i++) {
        const t = Math.random() * Math.PI * 2, p = Math.acos(2 * Math.random() - 1), r = radius * (0.7 + Math.random() * 0.3);
        pts.push(r * Math.sin(p) * Math.cos(t), r * Math.cos(p), r * Math.sin(p) * Math.sin(t));
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.Float32BufferAttribute(pts, 3));
      scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xdcc8b8, size: 0.12, transparent: true, opacity: 0.65 })));
    })();

    // ── 上排：Player Shield（对比基线）──
    const SHIELD_LINE = [
      { id:"shield-fig",  name:"Shield·护卫",  tag:"shield / frigate",    spec:{ id:"shield-fig",  family:"shield", hull:"frigate",    weapon:"laser", highSlots:2 } },
      { id:"shield-cru",  name:"Shield·巡洋",  tag:"shield / cruiser",    spec:{ id:"shield-cru",  family:"shield", hull:"cruiser",    weapon:"laser", highSlots:4 } },
      { id:"shield-btl",  name:"Shield·战列",  tag:"shield / battleship", spec:{ id:"shield-btl",  family:"shield", hull:"battleship", weapon:"laser", highSlots:5 } },
    ];

    // ── 下排：Player Armor（Fortress Engineering 改造版）──
    const ARMOR_LINE = [
      { id:"armor-fig",   name:"Armor·护卫",   tag:"armor / frigate",     spec:{ id:"armor-fig",   family:"armor",  hull:"frigate",    weapon:"turret", highSlots:2 } },
      { id:"armor-cru",   name:"Armor·巡洋",   tag:"armor / cruiser",     spec:{ id:"armor-cru",   family:"armor",  hull:"cruiser",    weapon:"turret", highSlots:4 } },
      { id:"armor-btl",   name:"Armor·战列",   tag:"armor / battleship",  spec:{ id:"armor-btl",   family:"armor",  hull:"battleship", weapon:"turret", highSlots:5 } },
    ];

    const ships = [];
    const gap = 5;

    function showError(def, err) {
      console.error(`[ERROR] ${def.name}:`, err);
      const panel = document.getElementById("error-panel");
      panel.style.display = "block";
      panel.innerHTML = `<div class="title">⚠ ${def.name} 生成失败</div><div class="stack">${err.message}\n\n${err.stack || ""}</div>`;
    }

    // 上排 Shield
    let cursor = 0;
    for (const def of SHIELD_LINE) {
      try {
        const ship = buildShip(def.spec);
        ship.updateMatrixWorld(true);
        const box = new THREE.Box3().setFromObject(ship);
        const L = box.max.z - box.min.z;
        ship.position.x = cursor + L / 2;
        ship.position.z = 14;
        ship.rotation.y = -0.45;
        cursor += L + gap;
        scene.add(ship);
        ships.push({ ship, def });
      } catch (err) {
        showError(def, err);
      }
    }
    const center = cursor / 2;
    for (let i = 0; i < ships.length; i++) ships[i].ship.position.x -= center;

    // 下排 Armor
    let cursor2 = 0;
    for (const def of ARMOR_LINE) {
      try {
        const ship = buildShip(def.spec);
        ship.updateMatrixWorld(true);
        const box = new THREE.Box3().setFromObject(ship);
        const L = box.max.z - box.min.z;
        ship.position.x = cursor2 + L / 2;
        ship.position.z = -14;
        ship.rotation.y = -0.45;
        cursor2 += L + gap;
        scene.add(ship);
        ships.push({ ship, def });
      } catch (err) {
        showError(def, err);
        // 即使失败也推进 cursor，避免重叠
        cursor2 += 12 + gap;
      }
    }
    const center2 = cursor2 / 2;
    for (let i = SHIELD_LINE.length; i < ships.length; i++) ships[i].ship.position.x -= center2;

    const updaters = [];
    for (const { ship, def } of ships) {
      const el = document.createElement("div");
      el.className = "tag";
      el.innerHTML = `<div class="t">${def.name}</div><div class="s">${def.tag}</div>`;
      document.body.appendChild(el);
      const wp = new THREE.Vector3();
      updaters.push(() => {
        ship.getWorldPosition(wp);
        wp.y += (def.spec.hull === "battleship" ? 14 : def.spec.hull === "cruiser" ? 11 : 8);
        wp.project(camera);
        el.style.left = (wp.x * 0.5 + 0.5) * innerWidth + "px";
        el.style.top = (-wp.y * 0.5 + 0.5) * innerHeight + "px";
        el.style.display = wp.z < 1 ? "block" : "none";
      });
    }

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      for (const { ship } of ships) {
        ship.rotation.y += 0.003;
        const sh = ship.userData.shield;
        if (sh) {
          const pulse = 0.5 + 0.5 * Math.sin(t * 1.4);
          sh.material.opacity = 0.05 + 0.05 * pulse;
          if (sh.children[0]) sh.children[0].material.opacity = 0.13 + 0.12 * pulse;
          sh.scale.setScalar(1 + 0.012 * pulse);
        }
        const fl = ship.userData.floaters;
        if (fl) for (const f of fl) {
          f.grp.position.y = f.base.y + Math.sin(t * 1.6 + f.phase) * f.ampY;
          f.grp.position.z = f.base.z + Math.sin(t * 1.1 + f.phase) * f.ampZ;
        }
      }
      controls.update();
      updaters.forEach(u => u());
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
