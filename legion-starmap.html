<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Legion Star Map HTML5 Demo</title>
<style>
html,body{margin:0;background:#020711;color:#dcecff;font-family:system-ui,sans-serif}body{padding:24px}.layout{max-width:1200px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:16px}.frame{overflow:hidden;border:1px solid #29435e;border-radius:14px;background:#020711;box-shadow:0 0 55px #12618a33 inset}.map-viewport{position:relative;overflow:hidden;touch-action:none}.map{display:block;width:100%;height:auto;cursor:grab;transform:translate(var(--pan-x,0px),var(--pan-y,0px)) scale(var(--zoom,1));transform-origin:center;transition:transform .16s ease}.map.is-dragging{cursor:grabbing;transition:none}.zoom-controls{position:absolute;right:12px;top:12px;display:flex;gap:6px;z-index:3}.zoom-controls button{width:34px;height:34px;border:1px solid #7dabc9aa;border-radius:6px;background:#061321dd;color:#dcecff;font-size:20px;line-height:1;cursor:pointer}.zoom-controls button:hover{background:#12304a}.side{border-left:1px solid #29435e;padding-left:15px}.side h2{font-size:18px;margin:0 0 12px}.side p,.side div{font-size:13px;line-height:1.6;color:#8ca3ba}.legend{display:grid;gap:9px;margin-top:18px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}@media(max-width:700px){.layout{grid-template-columns:1fr}.side{border-left:0;border-top:1px solid #29435e;padding:15px 0 0}}
</style></head>
<body><main class="layout"><section class="frame"><canvas id="map" class="map" width="1000" height="700"></canvas></section><aside class="side"><h2 id="title">&#x661f;&#x56fe;&#x6982;&#x89c8;</h2><p id="detail">&#x70b9;&#x51fb;&#x4efb;&#x610f;&#x661f;&#x7cfb;&#x8282;&#x70b9;&#x67e5;&#x770b;&#x8be6;&#x60c5;&#x3002</p><p>HTML5 Canvas &#183; 200 nodes &#183; 3 territories</p><div class="legend"><div><i class="dot" style="background:#ff5578"></i>&#x82cd;&#x7a79;&#x52ab;&#x56e2;</div><div><i class="dot" style="background:#ffc857"></i>&#x8d64;&#x8a93;&#x6559;&#x56e2;</div><div><i class="dot" style="background:#4bb8ff"></i>&#x9759;&#x9ed8;&#x96c6;&#x7fa4;</div><div><i class="dot" style="background:#55d69a"></i>&#x5148;&#x9a71;&#x6587;&#x660e;&#x6838;&#x5fc3;&#x533a;</div></div></aside></main>
<script>
(()=>{
const cv=document.getElementById('map'),x=cv.getContext('2d'),W=cv.width,H=cv.height,cx=500,cy=350,red='#ff5578',gold='#ffc857',blue='#4bb8ff',green='#55d69a';const nebula=new Image();nebula.src='legion-nebula.png';
const fs=[{n:'\u82cd\u7a79\u52ab\u56e2',c:red,a:-Math.PI/2},{n:'\u8d64\u8a93\u6559\u56e2',c:gold,a:Math.PI/6},{n:'\u9759\u9ed8\u96c6\u7fa4',c:blue,a:5*Math.PI/6}],nodes=[],edges=[],stars=[];let selected=null;
for(let i=0;i<260;i++)stars.push({x:(i*83%997)/997*W,y:(i*47%991)/991*H,r:.3+(i%5)*.22,z:.3+(i%7)/9,p:i*.73});
const polar=(r,a)=>({x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r});const rnd=n=>{const v=Math.sin(n*91.731)*43758.5453;return v-Math.floor(v)};
for(let f=0;f<3;f++)for(let row=0;row<8;row++)for(let col=0;col<6;col++){const a=fs[f].a-.98+col*.392+(row%2?.04:-.03)+(rnd(f*100+row*11+col)*.12-.06),p=polar(110+row*28+(rnd(f*700+row*19+col)*18-9),a);nodes.push({x:p.x,y:p.y,f,row,col,kind:row===0&&col===0?'\u8d77\u70b9':'\u661f\u7cfb',name:fs[f].n+'-'+String(row*6+col+1).padStart(2,'0')})}for(let f=0;f<3;f++)for(let extra=0;extra<14;extra++){const a=fs[f].a-.98+(extra/13)*1.96+(rnd(f*991+extra)*.10-.05),p=polar(270+rnd(f*313+extra)*32,a);nodes.push({x:p.x,y:p.y,f,row:8,col:extra,kind:'\u661f\u7cfb',name:fs[f].n+'-'+String(49+extra).padStart(2,'0')})}
for(let i=0;i<14;i++){const angle=i*2.3999632297+(rnd(i*13)*.22-.11),radius=Math.sqrt((i+.65)/14)*72+(rnd(i*31)*8-4),p=polar(Math.max(15,Math.min(76,radius)),angle);nodes.push({x:p.x,y:p.y,f:3,kind:'\u5148\u9a71\u9057\u8ff9',name:'\u5148\u9a71\u9057\u8ff9-'+String(i+1).padStart(2,'0'),cluster:Math.floor(i/7),depth:i%4})}const core={x:cx,y:cy,f:3,kind:'\u4e2d\u5fc3\u8282\u70b9',name:'\u5148\u9a71\u6587\u660e\u6838\u5fc3'};nodes.push(core);
nodes.forEach((node,index)=>{node.id=index});const link=(a,b,g=false)=>{if(!a||!b||a===b)return false;if(edges.some(e=>(e.a===a&&e.b===b)||(e.a===b&&e.b===a)))return false;edges.push({a,b,g});return true};function buildLocalLinks(group,maxDegree=3){const degree=new Map(group.map(n=>[n,0])),pairs=[];for(let i=0;i<group.length;i++)for(let j=i+1;j<group.length;j++)pairs.push({a:group[i],b:group[j],d:Math.hypot(group[i].x-group[j].x,group[i].y-group[j].y)});pairs.sort((a,b)=>a.d-b.d);pairs.forEach(p=>{if(p.d<105&&degree.get(p.a)<maxDegree&&degree.get(p.b)<maxDegree&&link(p.a,p.b)){degree.set(p.a,degree.get(p.a)+1);degree.set(p.b,degree.get(p.b)+1)}});group.forEach(n=>{if(degree.get(n)>0)return;const nearest=group.filter(m=>m!==n).sort((a,b)=>Math.hypot(n.x-a.x,n.y-a.y)-Math.hypot(n.x-b.x,n.y-b.y)).find(m=>degree.get(m)<maxDegree);if(nearest&&link(n,nearest)){degree.set(n,degree.get(n)+1);degree.set(nearest,degree.get(nearest)+1)}});return degree}for(let f=0;f<3;f++)buildLocalLinks(nodes.filter(n=>n.f===f));const relicDegree=buildLocalLinks(nodes.filter(n=>n.f===3&&n!==core));nodes.filter(n=>n.f===3&&n!==core).sort((a,b)=>Math.hypot(a.x-core.x,a.y-core.y)-Math.hypot(b.x-core.x,b.y-core.y)).slice(0,3).forEach(n=>{if(relicDegree.get(n)<3){link(n,core);relicDegree.set(n,relicDegree.get(n)+1)}});function linkFactionsToInner(){const relics=nodes.filter(n=>n.f===3&&n!==core);for(let f=0;f<3;f++){const outer=nodes.filter(n=>n.f===f).map(n=>({n,d:Math.min(...relics.map(r=>Math.hypot(n.x-r.x,n.y-r.y)))})).sort((a,b)=>a.d-b.d).slice(0,4);const used=[];outer.forEach(({n})=>{const target=relics.filter(r=>!used.includes(r)).sort((a,b)=>Math.hypot(n.x-a.x,n.y-a.y)-Math.hypot(n.x-b.x,n.y-b.y))[0];if(target){link(n,target,true);used.push(target)}})}}linkFactionsToInner();function buildPlayerConquestPaths(){for(let f=0;f<3;f++){const group=nodes.filter(n=>n.f===f),used=new Set(),start=group.filter(n=>Math.hypot(n.x-cx,n.y-cy)>265).sort((a,b)=>{const da=Math.abs(Math.atan2(Math.sin(Math.atan2(a.y-cy,a.x-cx)-fs[f].a),Math.cos(Math.atan2(a.y-cy,a.x-cx)-fs[f].a))),db=Math.abs(Math.atan2(Math.sin(Math.atan2(b.y-cy,b.x-cx)-fs[f].a),Math.cos(Math.atan2(b.y-cy,b.x-cx)-fs[f].a)));return da-db||Math.hypot(b.x-cx,b.y-cy)-Math.hypot(a.x-cx,a.y-cy)})[0],path=[];if(!start)continue;path.push(start);used.add(start);start.conquered=true;while(path.length<7){const prev=path[path.length-1],pr=Math.hypot(prev.x-cx,prev.y-cy),next=group.filter(n=>!used.has(n)&&Math.hypot(n.x-cx,n.y-cy)<pr-12).sort((a,b)=>Math.hypot(prev.x-a.x,prev.y-a.y)-Math.hypot(prev.x-b.x,prev.y-b.y))[0];if(!next)break;link(prev,next,true);next.conquered=true;used.add(next);path.push(next)}const last=path[path.length-1],inner=nodes.filter(n=>n.f===3&&n!==core&&!used.has(n)).sort((a,b)=>Math.hypot(last.x-a.x,last.y-a.y)-Math.hypot(last.x-b.x,last.y-b.y))[0];if(inner&&Math.hypot(last.x-inner.x,last.y-inner.y)<115){link(last,inner,true);inner.conquered=true}}}buildPlayerConquestPaths();const territoryCells=(()=>{const boundary=[];for(let i=0;i<72;i++){const a=i*Math.PI*2/72;boundary.push({x:cx+Math.cos(a)*318,y:cy+Math.sin(a)*318})}const clip=(poly,nx,ny,k)=>{const out=[];for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length],ain=nx*a.x+ny*a.y<=k,bin=nx*b.x+ny*b.y<=k;if(ain)out.push(a);if(ain!==bin){const da=nx*(b.x-a.x)+ny*(b.y-a.y),q=(k-nx*a.x-ny*a.y)/da;out.push({x:a.x+(b.x-a.x)*q,y:a.y+(b.y-a.y)*q})}}return out};return nodes.map(site=>{let poly=boundary.slice();nodes.forEach(other=>{if(other===site||!poly.length)return;const nx=other.x-site.x,ny=other.y-site.y,k=(nx*(other.x+site.x)+ny*(other.y+site.y))/2;poly=clip(poly,nx,ny,k)});return{site,poly}})})();function drawSystemTerritories(){territoryCells.forEach(({site,poly})=>{if(poly.length<3)return;const base=site.conquered?'#f4fbff':site.f<3?fs[site.f].c:green;x.beginPath();x.moveTo(poly[0].x,poly[0].y);poly.slice(1).forEach(p=>x.lineTo(p.x,p.y));x.closePath();x.fillStyle=site.conquered?'#f4fbff1b':base+'16';x.strokeStyle=site.conquered?'#f4fbff45':base+'24';x.lineWidth=site.conquered?1.05:.55;x.fill();x.stroke()})}const territoryEdges=(()=>{const radii=[84,132,182,232,278,318],j=[0,.055,-.04,.06,-.035,.02],bases=[-5*Math.PI/6,-Math.PI/6,Math.PI/2,7*Math.PI/6];return bases.map((base,bi)=>radii.map((r,i)=>polar(r,base+j[(i+bi)%j.length])))} )();function territory(f){const left=territoryEdges[f],right=territoryEdges[f+1],leftAngle=Math.atan2(left[left.length-1].y-cy,left[left.length-1].x-cx),rightAngle=Math.atan2(right[right.length-1].y-cy,right[right.length-1].x-cx);x.beginPath();x.moveTo(left[0].x,left[0].y);left.forEach(p=>x.lineTo(p.x,p.y));x.arc(cx,cy,318,leftAngle,rightAngle,false);right.slice(0,-1).reverse().forEach(p=>x.lineTo(p.x,p.y));x.arc(cx,cy,84,rightAngle,leftAngle,true);x.closePath();x.fillStyle=fs[f].c+'25';x.strokeStyle=fs[f].c+'aa';x.lineWidth=1.7;x.fill();x.stroke()}
function galaxy(n,t){const coreNode=n===core,rel=n.f===3&&!coreNode,hub=!coreNode&&(n.kind==='\u8d77\u70b9'||n.id%13===0),tier=coreNode?3:hub?2:(n.id%10<2?1:0),r=coreNode?17:rel?2.4+(n.depth||0)*.35:hub?8:tier===1?5.8:3.6,baseColor=coreNode?'#9affc9':rel?green:fs[n.f].c,c=n.conquered?'#f4fbff':baseColor,phase=(n.id*1.731)%6.283,pulse=1+Math.sin(t/1100+n.id*.37)*.07;x.save();x.translate(n.x,n.y);x.rotate(phase);x.globalAlpha=coreNode?.96:hub?.82:tier===1?.7:.48;if(!coreNode){x.strokeStyle=n.conquered?baseColor:c;x.lineWidth=rel?.55:hub?1.1:.75;x.beginPath();x.ellipse(0,0,r+5,Math.max(1.5,r*.34),0,0,Math.PI*2);x.stroke();if(hub||tier===1){x.globalAlpha=hub?.18:.1;x.beginPath();x.ellipse(0,0,r+11,r*.72,0,0,Math.PI*2);x.stroke()}}const glow=x.createRadialGradient(0,0,0,0,0,r*(coreNode?2.5:hub?2.1:1.8));glow.addColorStop(0,c);glow.addColorStop(.22,c+'cc');glow.addColorStop(1,c+'00');x.globalAlpha=coreNode?.7:hub?.38:tier===1?.22:.13;x.fillStyle=glow;x.beginPath();x.arc(0,0,r*(coreNode?2.5:hub?2.1:1.8),0,Math.PI*2);x.fill();x.globalAlpha=coreNode?.98:hub?.96:tier===1?.86:.72;x.shadowColor=c;x.shadowBlur=coreNode?22:hub?12:6;x.fillStyle=c;x.beginPath();x.arc(0,0,r*(.9+.1*pulse),0,Math.PI*2);x.fill();x.shadowBlur=0;if(!coreNode){const satellites=rel?2:hub?5:tier===1?3:2;for(let i=0;i<satellites;i++){const a=i*Math.PI*2/satellites+(n.id%5)*.17,dist=r+(hub?5:3)+(i%2)*2;x.globalAlpha=hub?.8:tier===1?.65:.52;x.fillStyle=i%3===0?'#fff':c;x.beginPath();x.arc(Math.cos(a)*dist,Math.sin(a)*dist,rel?.8:hub?1.5:1.05,0,Math.PI*2);x.fill()}}if(n.conquered){x.globalAlpha=.9;x.strokeStyle=baseColor;x.lineWidth=1.1;x.beginPath();x.arc(0,0,r+6,0,Math.PI*2);x.stroke()}if(n===selected){x.globalAlpha=1;x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();x.arc(0,0,r+9+Math.sin(t/180+n.id)*2,0,Math.PI*2);x.stroke()}x.restore()}function drawConqueredZones(){nodes.filter(n=>n.conquered).forEach(n=>{const base=n===core?30:n.kind==='\u8d77\u70b9'?25:21,pts=9,phase=rnd(n.id*37)*6.283;x.save();x.beginPath();for(let i=0;i<pts;i++){const a=phase+i*Math.PI*2/pts,rr=base*(.78+rnd(n.id*53+i)*.42),px=n.x+Math.cos(a)*rr,py=n.y+Math.sin(a)*rr;if(i===0)x.moveTo(px,py);else x.lineTo(px,py)}x.closePath();x.fillStyle='#f4fbff16';x.strokeStyle='#f4fbff55';x.lineWidth=1.1;x.fill();x.stroke();x.restore()})}
function draw(t){const bg=x.createRadialGradient(cx,cy,5,cx,cy,500);bg.addColorStop(0,'#123d5b');bg.addColorStop(.5,'#071827');bg.addColorStop(1,'#020711');x.fillStyle=bg;x.fillRect(0,0,W,H);x.globalAlpha=.46;if(nebula.complete&&nebula.naturalWidth)x.drawImage(nebula,0,0,W,H);x.globalAlpha=1;x.fillStyle='rgba(1,8,20,.34)';x.fillRect(0,0,W,H);stars.forEach(s=>{x.globalAlpha=(.3+.5*Math.sin(t/900+s.p))*s.z;x.fillStyle=s.z>.7?'#e8f7ff':'#7199b8';x.beginPath();x.arc((s.x+t*s.z*.012)%W,s.y,s.r*s.z,0,Math.PI*2);x.fill()});x.globalAlpha=1;drawSystemTerritories();x.beginPath();x.arc(cx,cy,86,0,Math.PI*2);x.fillStyle='#55d69a18';x.strokeStyle='#55d69a99';x.setLineDash([5,5]);x.fill();x.stroke();x.setLineDash([]);edges.forEach(e=>{x.strokeStyle=e.a.conquered&&e.b.conquered?'#f4fbff99':e.g?'#b7ffe877':'#7892a84d';x.lineWidth=e.a.conquered&&e.b.conquered?1.15:e.g?1.25:.8;x.beginPath();x.moveTo(e.a.x,e.a.y);x.lineTo(e.b.x,e.b.y);x.setLineDash([]);x.stroke()});x.setLineDash([]);nodes.forEach(n=>galaxy(n,t));x.fillStyle='#f1fff8';x.font='bold 16px system-ui';x.textAlign='center';x.fillText('\u82cd\u7a79\u52ab\u56e2',500,53);x.fillText('\u8d64\u8a93\u6559\u56e2',790,515);x.fillText('\u9759\u9ed8\u96c6\u7fa4',185,515);x.font='12px system-ui';x.fillStyle='#cffff0';x.fillText('\u5148\u9a71\u6587\u660e\u6838\u5fc3',cx,cy-5);x.fillText('\u6cf0\u5766\u5236\u9020\u79d1\u6280',cx,cy+17);requestAnimationFrame(draw)}
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect(),mx=(e.clientX-r.left)*W/r.width,my=(e.clientY-r.top)*H/r.height;let best=nodes[0],dist=Infinity;nodes.forEach(n=>{const d=Math.hypot(n.x-mx,n.y-my);if(d<dist){best=n;dist=d}});if(dist<20){selected=best;document.getElementById('title').textContent=best.name;document.getElementById('detail').textContent=best.kind+' 闂?'+(best.f<3?fs[best.f].n+'\u9886\u571f':'&#x5148;&#x9a71;&#x6587;&#x660e;&#x6838;&#x5fc3;&#x533a;')}});requestAnimationFrame(draw);
})();</script>
<script>(()=>{const cv=document.getElementById('map');if(!cv)return;const vp=document.createElement('div');vp.className='map-viewport';vp.style.cssText='position:relative;overflow:hidden;touch-action:none';cv.parentNode.insertBefore(vp,cv);vp.appendChild(cv);const controls=document.createElement('div');controls.className='zoom-controls';controls.innerHTML='<button type="button" id="zoom-out" aria-label="zoom out">−</button><button type="button" id="zoom-reset" aria-label="reset zoom">⌂</button><button type="button" id="zoom-in" aria-label="zoom in">＋</button>';vp.appendChild(controls);const style=document.createElement('style');style.textContent='.map{transform:translate(var(--pan-x,0px),var(--pan-y,0px)) scale(var(--zoom,1));transform-origin:center;transition:transform .16s ease;cursor:grab}.map.is-dragging{cursor:grabbing;transition:none}.zoom-controls{position:absolute;right:10px;top:10px;display:flex;gap:6px;z-index:3}.zoom-controls button{width:34px;height:34px;border:1px solid #7dabc9aa;border-radius:6px;background:#061321dd;color:#dcecff;font-size:20px;cursor:pointer}@media(max-width:700px){.zoom-controls button{width:38px;height:38px}}';document.head.appendChild(style);let zoom=1,px=0,py=0;const apply=()=>{cv.style.setProperty('--zoom',zoom);cv.style.setProperty('--pan-x',px+'px');cv.style.setProperty('--pan-y',py+'px')};document.getElementById('zoom-in').onclick=()=>{zoom=Math.min(3,zoom+.25);apply()};document.getElementById('zoom-out').onclick=()=>{zoom=Math.max(1,zoom-.25);if(zoom===1){px=0;py=0}apply()};document.getElementById('zoom-reset').onclick=()=>{zoom=1;px=0;py=0;apply()};let drag=null;vp.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY,px,py};cv.classList.add('is-dragging');vp.setPointerCapture(e.pointerId)});vp.addEventListener('pointermove',e=>{if(!drag)return;px=drag.px+e.clientX-drag.x;py=drag.py+e.clientY-drag.y;apply()});vp.addEventListener('pointerup',()=>{drag=null;cv.classList.remove('is-dragging')});vp.addEventListener('pointercancel',()=>{drag=null;cv.classList.remove('is-dragging')});vp.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(1,Math.min(3,zoom+(e.deltaY<0?.15:-.15)));apply()},{passive:false})})();</script></body></html>
